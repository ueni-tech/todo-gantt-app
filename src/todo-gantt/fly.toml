# fly.toml app configuration file generated for todo-gantt on 2024-07-19T17:32:42+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'todo-gantt'
primary_region = 'nrt'
console_command = 'php /var/www/html/artisan tinker'

[build]
  [build.args]
    NODE_VERSION = '18'
    PHP_VERSION = '8.2'

[env]
  APP_NAME = 'TodoGantt'
  APP_ENV = 'production'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  LOG_STDERR_FORMATTER = 'Monolog\Formatter\JsonFormatter'
  SESSION_DRIVER = 'cookie'
  SESSION_SECURE_COOKIE = 'true'
  SESSION_DOMAIN= 'todo-gantt.fly.dev'
  DB_CONNECTION = "mysql"
  DB_HOST = "todo-gantt-db.internal"
  DB_DATABASE= "todo-gantt-db"
  # PHP-FPM最適化設定（512MB VM用）
  PHP_PM_MAX_CHILDREN = "15"
  PHP_PM_START_SERVERS = "4"
  PHP_MIN_SPARE_SERVERS = "2"
  PHP_MAX_SPARE_SERVERS = "6"
  PHP_MEMORY_LIMIT = "128M"
  PHP_MAX_EXECUTION_TIME = "60"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[processes]]
  name = "app"

[[processes]]
  name = "scheduler"
  command = "php /var/www/html/artisan schedule:work"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
